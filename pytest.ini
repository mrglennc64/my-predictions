[pytest]
# The suite lives in src/weather_trigger/tests.py. pytest's default
# python_files (test_*.py, *_test.py) does NOT match "tests.py", so a bare
# `pytest` from the repo root silently collected zero tests. Match it explicitly
# so the invariant tests actually guard in CI / the pipeline.
python_files = tests.py test_*.py *_test.py
testpaths = src app
